<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      저장된 테마를 첫 페인트 전에 적용한다.
      React 가 마운트된 뒤에 적용하면, 라이트를 고른 사용자가 새로고침할 때마다
      다크 배경이 한 프레임 번쩍인다(FOUC). 그래서 번들보다 먼저 도는
      인라인 스크립트로 처리한다. 실패해도 기본값(다크)으로 동작한다.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'light' || t === 'dark') {
            document.documentElement.setAttribute('data-theme', t);
          }
        } catch (e) { /* 저장소 접근이 막혀 있으면 시스템 설정을 따른다 */ }
      })();
    </script>

    <!--
      폰트는 CSS 안의 @import 가 아니라 여기서 받는다.
      @import 는 스타일시트를 먼저 내려받은 뒤에야 요청이 시작돼 렌더를 두 번 막는다.
      한글 가변 폰트(Pretendard)는 화면 문구를 영어로 통일하면서 제거했다.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap"
    />

    <title>TechDoc Agent</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
